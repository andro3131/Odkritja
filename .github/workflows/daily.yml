name: Dnevni ingest

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Odvisnosti
        run: pip install -r requirements.txt
      - name: Ingest
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAILY_COST_CAP: "0.15"
          TZ: Europe/Ljubljana
        run: python3 ingest.py
      - name: Commit
        run: |
          git config user.name "vremenko-bot"
          git config user.email "vremenko-bot@users.noreply.github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "Ni sprememb"
          else
            git commit -m "Dnevni brief $(date +%F)"
            git push
          fi
